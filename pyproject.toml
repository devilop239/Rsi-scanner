[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nifty-stoch-rsi"
version = "0.1.0"
description = "Automated Nifty 50 Stochastic RSI scanner with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivam" }]

dependencies = [
    # Web framework
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.34.0",

    # Telegram Bot
    "aiogram==3.31.0",

    # Data
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "numpy>=2.0.0",

    # Database / ORM
    "sqlalchemy[asyncio]==2.1.1",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",           # PostgreSQL async driver
    "aiosqlite>=0.21.0",         # SQLite async driver (dev/tests)

    # Config / Validation
    "pydantic>=2.10.0",
    "pydantic-settings==2.6.1",

    # HTTP / Retry
    "tenacity>=9.0.0",


    # Logging
    "structlog>=24.1.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",              # TestClient
    "anyio>=4.7.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "types-pytz>=2025.1.0",
    "types-python-dateutil>=2.9.0",
    "pandas-stubs>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "S101",    # Use of assert detected (needed in tests)
    "S603",    # subprocess.run - not used in this project
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "apscheduler.*", "structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
    "-v",
]
markers = [
    "live: marks tests as requiring live network access (deselect with '-m not live')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/infra/database.py"]  # Engine setup is tested implicitly

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
